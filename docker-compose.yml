version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bikangu-postgres
    environment:
      POSTGRES_DB: bikangu
      POSTGRES_USER: bikangu
      POSTGRES_PASSWORD: bikangu
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikangu -d bikangu"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bikangu-network

  redis:
    image: redis:7-alpine
    container_name: bikangu-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bikangu-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bikangu-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:postgresql://postgres:5432/bikangu
      DATABASE_USERNAME: bikangu
      DATABASE_PASSWORD: bikangu
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-256-bits}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      FCM_SENDER_ID: ${FCM_SENDER_ID:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-your-webhook-secret-change-in-production}
      MOCK_PROVIDER_ENABLED: "true"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - bikangu-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: bikangu-admin
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bikangu-network

  # Mock provider for development
  mock-provider:
    image: node:20-alpine
    container_name: bikangu-mock-provider
    working_dir: /app
    command: sh -c "npm install -g http-server && http-server -p 8081 -a 0.0.0.0"
    volumes:
      - ./infrastructure/mock-provider:/app
    ports:
      - "8081:8081"
    networks:
      - bikangu-network

volumes:
  postgres_data:
  redis_data:

networks:
  bikangu-network:
    driver: bridge